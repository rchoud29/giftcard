services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: giftcard
      POSTGRES_PASSWORD: giftcard
      POSTGRES_DB: giftcard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local email inbox for verification / reset / alert emails: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
